<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MTG録音・文字起こし</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f4f6fb;--surface:#fff;--border:#e4e9f2;
  --text:#1a1f36;--text2:#4e5a78;--text3:#8b97b1;
  --red:#ef4444;--green:#059669;--violet:#7c3aed;
  --r:14px;--sh:0 2px 8px rgba(0,0,0,.07),0 8px 24px rgba(0,0,0,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter','Noto Sans JP',sans-serif;font-size:14px;line-height:1.6;padding:24px 16px;min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:700px;margin:0 auto}
h1{font-size:21px;font-weight:800;text-align:center;margin-bottom:4px}
.sub{color:var(--text2);font-size:13px;text-align:center;margin-bottom:24px}

/* title */
.title-row{background:var(--surface);border-radius:var(--r);padding:14px 18px;box-shadow:var(--sh);border:1px solid var(--border);margin-bottom:16px;display:flex;align-items:center;gap:10px}
.title-row label{font-size:12px;font-weight:600;color:var(--text3);white-space:nowrap}
.title-row input{flex:1;border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14px;font-family:inherit;color:var(--text);outline:none}
.title-row input:focus{border-color:var(--violet)}

/* card */
.card{background:var(--surface);border-radius:var(--r);padding:28px 20px 24px;box-shadow:var(--sh);border:1px solid var(--border);margin-bottom:16px}

/* state indicator */
.state-badge{display:inline-flex;align-items:center;gap:7px;padding:5px 14px;border-radius:99px;font-size:12px;font-weight:700;margin-bottom:20px}
.state-badge.idle{background:#f1f5f9;color:var(--text3)}
.state-badge.recording{background:#fef2f2;color:var(--red)}
.state-badge.paused{background:#fffbeb;color:#b45309}
.state-badge.done{background:#ecfdf5;color:var(--green)}
.pulse{width:9px;height:9px;border-radius:50%;background:currentColor}
.pulse.blink{animation:blink .9s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* timer */
.timer{font-size:56px;font-weight:800;letter-spacing:2px;font-variant-numeric:tabular-nums;margin-bottom:24px;transition:color .2s}
.timer.rec{color:var(--red)}

/* buttons */
.btn-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;padding:14px 30px;border-radius:99px;font-size:15px;font-weight:700;font-family:inherit;border:none;cursor:pointer;transition:all .15s}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none !important}
.btn-main{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 4px 16px rgba(239,68,68,.3)}
.btn-main:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 20px rgba(239,68,68,.4)}
.btn-main.stop{background:linear-gradient(135deg,#1f2937,#374151);box-shadow:0 4px 16px rgba(0,0,0,.2)}
.btn-main.stop:hover:not(:disabled){box-shadow:0 6px 20px rgba(0,0,0,.3)}
.btn-sub{background:#f1f5f9;color:var(--text);border:1.5px solid var(--border);font-size:14px;padding:12px 22px}
.btn-sub:hover:not(:disabled){background:#e2e8f0}

/* sr status */
.sr-status{margin-top:14px;font-size:12px;color:var(--text3);min-height:18px;text-align:center}
.sr-status.ok{color:var(--green)}
.sr-status.err{color:var(--red)}

/* transcript */
.tx-header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--border);background:#fafbff;border-radius:var(--r) var(--r) 0 0}
.tx-header span{font-size:13px;font-weight:700}
.tx-count{font-size:11px;color:var(--text3)}
.tx-body{min-height:220px;max-height:340px;overflow-y:auto;padding:16px 18px;scroll-behavior:smooth}
.tx-body:empty::before{content:'録音を開始するとここに文字起こしが表示されます';color:var(--text3);font-size:13px;display:flex;align-items:center;justify-content:center;height:180px}
.seg{display:flex;gap:10px;margin-bottom:10px}
.seg-t{font-size:10px;color:var(--text3);white-space:nowrap;padding-top:3px;min-width:42px}
.seg-body{font-size:14px;color:var(--text);flex:1;line-height:1.65}
.seg-body.interim{color:var(--text3);font-style:italic}

/* downloads */
.dl-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dl-btn{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:10px;border:1.5px solid var(--border);background:#fafbff;cursor:pointer;font-family:inherit;transition:all .15s;width:100%}
.dl-btn:hover{border-color:var(--violet);background:#f5f3ff}
.dl-icon{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.dl-icon.audio{background:linear-gradient(135deg,#f59e0b,#d97706)}
.dl-icon.txt{background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.dl-label{font-size:13px;font-weight:700;color:var(--text)}
.dl-sub{font-size:11px;color:var(--text3);margin-top:1px}

.hidden{display:none}
.notice{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 14px;font-size:12px;color:#1e40af;margin-bottom:16px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">

  <h1>🎙️ MTG録音・文字起こし</h1>
  <p class="sub">スタッフ面談・社内MTG・突発的な会話を即録音。文字起こしはリアルタイム表示。</p>

  <div class="notice">⚠️ <strong>Chrome推奨</strong>（Safariは文字起こし非対応）。マイク許可が必要です。録音データは外部送信されません。</div>

  <div class="title-row">
    <label>MTG名</label>
    <input id="mtgTitle" type="text" placeholder="例：kasumi面談 / 4月定例MTG">
  </div>

  <!-- 録音カード -->
  <div class="card" style="text-align:center">
    <div style="display:flex;justify-content:center;margin-bottom:0">
      <span class="state-badge idle" id="badge">
        <span class="pulse" id="pulseEl"></span>
        <span id="badgeText">待機中</span>
      </span>
    </div>

    <div class="timer" id="timer">00:00</div>

    <div class="btn-row">
      <button class="btn btn-main" id="btnRec" onclick="onRecClick()">● 録音開始</button>
      <button class="btn btn-sub" id="btnPause" onclick="onPauseClick()" disabled>⏸ 一時停止</button>
    </div>

    <div class="sr-status" id="srStatus"></div>
  </div>

  <!-- 文字起こし -->
  <div class="card" style="padding:0;overflow:hidden">
    <div class="tx-header">
      <span>📝 文字起こし（リアルタイム）</span>
      <span class="tx-count" id="txCount">0 文字</span>
    </div>
    <div class="tx-body" id="txBody"></div>
  </div>

  <!-- ダウンロード -->
  <div class="card hidden" id="dlCard">
    <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:14px">💾 ダウンロード</div>
    <div class="dl-grid">
      <button class="dl-btn" onclick="dlAudio()">
        <div class="dl-icon audio">🎵</div>
        <div>
          <div class="dl-label">音声ファイル</div>
          <div class="dl-sub" id="dlAudioName">.webm</div>
        </div>
      </button>
      <button class="dl-btn" onclick="dlText()">
        <div class="dl-icon txt">📄</div>
        <div>
          <div class="dl-label">文字起こし</div>
          <div class="dl-sub" id="dlTextName">.txt</div>
        </div>
      </button>
    </div>
  </div>

</div>

<script>
// ---- 状態変数 ----
const S = { IDLE: 0, RECORDING: 1, PAUSED: 2, DONE: 3 };
let state = S.IDLE;

let mediaRecorder = null;
let audioChunks   = [];
let audioBlob     = null;
let stream        = null;

let recognition   = null;
let srRunning     = false;
let srRestart     = null;

let timerIv       = null;
let elapsed       = 0;

let segments      = [];   // {time, text}
let interimEl     = null;

// ---- タイマー ----
const pad = n => String(n).padStart(2,'0');
const fmt = s => `${pad(Math.floor(s/60))}:${pad(s%60)}`;

function tickStart() {
  timerIv = setInterval(() => { elapsed++; el('timer').textContent = fmt(elapsed); }, 1000);
}
function tickStop() { clearInterval(timerIv); timerIv = null; }

// ---- UI helpers ----
const el = id => document.getElementById(id);

function setUI(s) {
  state = s;
  const badge = el('badge'), dot = el('pulseEl'), txt = el('badgeText');
  const btnRec = el('btnRec'), btnPause = el('btnPause'), timer = el('timer');

  badge.className = 'state-badge';
  dot.className   = 'pulse';

  if (s === S.IDLE) {
    badge.classList.add('idle');
    txt.textContent     = '待機中';
    btnRec.textContent  = '● 録音開始';
    btnRec.className    = 'btn btn-main';
    btnPause.disabled   = true;
    btnPause.textContent = '⏸ 一時停止';
    timer.classList.remove('rec');
  } else if (s === S.RECORDING) {
    badge.classList.add('recording');
    dot.classList.add('blink');
    txt.textContent     = '録音中…';
    btnRec.textContent  = '■ 録音停止';
    btnRec.className    = 'btn btn-main stop';
    btnPause.disabled   = false;
    btnPause.textContent = '⏸ 一時停止';
    timer.classList.add('rec');
  } else if (s === S.PAUSED) {
    badge.classList.add('paused');
    txt.textContent     = '一時停止中';
    btnRec.textContent  = '■ 録音停止';
    btnRec.className    = 'btn btn-main stop';
    btnPause.disabled   = false;
    btnPause.textContent = '▶ 再開';
    timer.classList.remove('rec');
  } else if (s === S.DONE) {
    badge.classList.add('done');
    txt.textContent     = '録音完了';
    btnRec.textContent  = '● 新しい録音を開始';
    btnRec.className    = 'btn btn-main';
    btnPause.disabled   = true;
    timer.classList.remove('rec');
  }
}

// ---- ボタンハンドラ ----
async function onRecClick() {
  if (state === S.IDLE || state === S.DONE) {
    await startRecording();
  } else if (state === S.RECORDING || state === S.PAUSED) {
    stopRecording();
  }
}

function onPauseClick() {
  if (state === S.RECORDING) pauseRecording();
  else if (state === S.PAUSED) resumeRecording();
}

// ---- 録音 ----
async function startRecording() {
  // リセット
  audioChunks = [];
  audioBlob   = null;
  segments    = [];
  elapsed     = 0;
  el('timer').textContent = '00:00';
  el('txBody').innerHTML  = '';
  el('txCount').textContent = '0 文字';
  el('dlCard').classList.add('hidden');
  el('srStatus').textContent = '';
  el('srStatus').className   = 'sr-status';
  interimEl = null;

  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch(e) {
    alert('マイクの許可が必要です。ブラウザのアドレスバー横のマイクアイコンから許可してください。');
    return;
  }

  mediaRecorder = new MediaRecorder(stream, { mimeType: getSupportedMime() });
  mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) audioChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
    stream.getTracks().forEach(t => t.stop());
    showDownload();
  };
  mediaRecorder.start(300);

  setUI(S.RECORDING);
  tickStart();
  srStart();
}

function stopRecording() {
  tickStop();
  srStop();
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  setUI(S.DONE);
}

function pauseRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.pause();
  tickStop();
  srStop();
  setUI(S.PAUSED);
}

function resumeRecording() {
  if (mediaRecorder && mediaRecorder.state === 'paused') mediaRecorder.resume();
  tickStart();
  srStart();
  setUI(S.RECORDING);
}

function getSupportedMime() {
  const types = ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'];
  for (const t of types) if (MediaRecorder.isTypeSupported(t)) return t;
  return '';
}

// ---- 音声認識 ----
function srStart() {
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    el('srStatus').textContent = '⚠️ このブラウザは文字起こし非対応です（Chrome推奨）';
    el('srStatus').className   = 'sr-status err';
    return;
  }
  srStop(); // 二重起動防止

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'ja-JP';
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    srRunning = true;
    el('srStatus').textContent = '🎤 文字起こし中…';
    el('srStatus').className   = 'sr-status ok';
  };

  recognition.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        const text = e.results[i][0].transcript.trim();
        if (text) {
          segments.push({ time: fmt(elapsed), text });
          addSeg(fmt(elapsed), text, false);
          updateCount();
        }
        interim = '';
      } else {
        interim += e.results[i][0].transcript;
      }
    }
    updateInterim(interim);
  };

  recognition.onerror = e => {
    srRunning = false;
    if (e.error === 'no-speech') {
      // 無音は正常。自動再起動
      scheduleRestart();
      return;
    }
    if (e.error === 'aborted') return;
    el('srStatus').textContent = `⚠️ 認識エラー：${e.error}`;
    el('srStatus').className   = 'sr-status err';
    scheduleRestart();
  };

  recognition.onend = () => {
    srRunning = false;
    scheduleRestart();
  };

  try {
    recognition.start();
  } catch(e) {
    scheduleRestart();
  }
}

function scheduleRestart() {
  clearTimeout(srRestart);
  if (state !== S.RECORDING) return;
  srRestart = setTimeout(() => {
    if (state === S.RECORDING && !srRunning) srStart();
  }, 400);
}

function srStop() {
  clearTimeout(srRestart);
  srRunning = false;
  if (recognition) {
    recognition.onend  = null;
    recognition.onresult = null;
    recognition.onerror  = null;
    try { recognition.abort(); } catch(e) {}
    recognition = null;
  }
  clearInterim();
  el('srStatus').textContent = '';
  el('srStatus').className   = 'sr-status';
}

// ---- 文字起こし表示 ----
function addSeg(time, text, isInterim) {
  const body = el('txBody');
  if (!isInterim) {
    clearInterim();
    const d = document.createElement('div');
    d.className = 'seg';
    d.innerHTML = `<span class="seg-t">${time}</span><span class="seg-body">${esc(text)}</span>`;
    body.appendChild(d);
  } else {
    if (!interimEl) {
      interimEl = document.createElement('div');
      interimEl.className = 'seg';
      interimEl.innerHTML = `<span class="seg-t">${time}</span><span class="seg-body interim"></span>`;
      body.appendChild(interimEl);
    }
    interimEl.querySelector('.seg-body').textContent = text;
  }
  body.scrollTop = body.scrollHeight;
}

function updateInterim(text) {
  if (!text.trim()) { clearInterim(); return; }
  addSeg(fmt(elapsed), text, true);
}

function clearInterim() {
  if (interimEl) { interimEl.remove(); interimEl = null; }
}

function updateCount() {
  el('txCount').textContent = segments.reduce((s,t) => s + t.text.length, 0) + ' 文字';
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ---- ダウンロード ----
function baseName() {
  const title = el('mtgTitle').value.trim() || 'MTG録音';
  const d = new Date();
  const dt = `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
  return `${title}_${dt}`;
}

function showDownload() {
  const name = baseName();
  const ext  = audioBlob ? (audioBlob.type.includes('mp4') ? 'mp4' : 'webm') : 'webm';
  el('dlAudioName').textContent = name + '.' + ext;
  el('dlTextName').textContent  = name + '.txt';
  el('dlCard').classList.remove('hidden');
}

function dlAudio() {
  if (!audioBlob) return;
  const ext = audioBlob.type.includes('mp4') ? 'mp4' : 'webm';
  trigger(URL.createObjectURL(audioBlob), baseName() + '.' + ext);
}

function dlText() {
  if (!segments.length) { alert('文字起こしテキストがありません。'); return; }
  const title = el('mtgTitle').value.trim() || 'MTG録音';
  const now   = new Date().toLocaleString('ja-JP');
  let txt = `【${title}】\n録音日時：${now}\n録音時間：${fmt(elapsed)}\n${'─'.repeat(36)}\n\n`;
  segments.forEach(s => { txt += `[${s.time}] ${s.text}\n`; });
  const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
  trigger(URL.createObjectURL(blob), baseName() + '.txt');
}

function trigger(url, name) {
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
</script>
</body>
</html>
