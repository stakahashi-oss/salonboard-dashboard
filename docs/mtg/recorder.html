<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MTG録音</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb;--surface:#fff;--border:#e4e9f2;
  --text:#1a1f36;--text2:#4e5a78;--text3:#8b97b1;
  --red:#ef4444;--green:#059669;--violet:#7c3aed;
  --r:16px;--sh:0 2px 8px rgba(0,0,0,.07),0 8px 24px rgba(0,0,0,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter','Noto Sans JP',sans-serif;font-size:14px;line-height:1.6;padding:32px 16px;min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto}

h1{font-size:20px;font-weight:800;text-align:center;margin-bottom:4px}
.sub{color:var(--text2);font-size:13px;text-align:center;margin-bottom:28px}

.title-row{background:var(--surface);border-radius:var(--r);padding:14px 18px;box-shadow:var(--sh);border:1px solid var(--border);margin-bottom:16px;display:flex;align-items:center;gap:10px}
.title-row label{font-size:12px;font-weight:600;color:var(--text3);white-space:nowrap}
.title-row input{flex:1;border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14px;font-family:inherit;color:var(--text);outline:none}
.title-row input:focus{border-color:var(--violet)}

.card{background:var(--surface);border-radius:var(--r);padding:32px 24px;box-shadow:var(--sh);border:1px solid var(--border);margin-bottom:16px;text-align:center}

/* badge */
.badge{display:inline-flex;align-items:center;gap:7px;padding:5px 16px;border-radius:99px;font-size:12px;font-weight:700;margin-bottom:24px}
.badge.idle{background:#f1f5f9;color:var(--text3)}
.badge.rec{background:#fef2f2;color:var(--red)}
.badge.paused{background:#fffbeb;color:#b45309}
.badge.done{background:#ecfdf5;color:var(--green)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0}
.dot.blink{animation:blink .9s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* timer */
.timer{font-size:64px;font-weight:800;letter-spacing:3px;font-variant-numeric:tabular-nums;margin-bottom:28px;color:var(--text);transition:color .2s}
.timer.rec{color:var(--red)}

/* sr count */
.sr-count{font-size:12px;color:var(--text3);margin-bottom:24px;min-height:18px}
.sr-count.ok{color:var(--green)}

/* buttons */
.btn-row{display:flex;justify-content:center;gap:12px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:15px 32px;border-radius:99px;font-size:15px;font-weight:700;font-family:inherit;border:none;cursor:pointer;transition:all .15s}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn-rec{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 4px 16px rgba(239,68,68,.3)}
.btn-rec:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 20px rgba(239,68,68,.4)}
.btn-rec.stop{background:linear-gradient(135deg,#1f2937,#374151);box-shadow:0 4px 14px rgba(0,0,0,.2)}
.btn-sub{background:#f1f5f9;color:var(--text);border:1.5px solid var(--border);font-size:14px;padding:13px 22px}
.btn-sub:hover:not(:disabled){background:#e2e8f0}

/* downloads */
.dl-card{background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:var(--sh);border:1px solid var(--border);display:none}
.dl-card.show{display:block}
.dl-title{font-size:13px;font-weight:700;margin-bottom:14px}
.dl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dl-btn{display:flex;align-items:center;gap:10px;padding:14px;border-radius:10px;border:1.5px solid var(--border);background:#fafbff;cursor:pointer;font-family:inherit;transition:all .15s;width:100%;text-align:left}
.dl-btn:hover{border-color:var(--violet);background:#f5f3ff}
.dl-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.dl-icon.a{background:linear-gradient(135deg,#f59e0b,#d97706)}
.dl-icon.t{background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.dl-label{font-size:13px;font-weight:700;color:var(--text)}
.dl-sub{font-size:11px;color:var(--text3);margin-top:1px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎙️ MTG録音</h1>
  <p class="sub">録音停止後に音声・文字起こしをダウンロードできます</p>

  <div class="title-row">
    <label>MTG名</label>
    <input id="title" type="text" placeholder="例：kasumi面談 / 4月定例MTG">
  </div>

  <div class="card">
    <div style="display:flex;justify-content:center">
      <span class="badge idle" id="badge">
        <span class="dot" id="dot"></span>
        <span id="badgeTxt">待機中</span>
      </span>
    </div>

    <div class="timer" id="timer">00:00</div>

    <div class="sr-count" id="srCount"></div>

    <div class="btn-row">
      <button class="btn btn-rec" id="btnRec" onclick="onRec()">● 録音開始</button>
      <button class="btn btn-sub" id="btnPause" onclick="onPause()" disabled>⏸ 一時停止</button>
    </div>
  </div>

  <div class="dl-card" id="dlCard">
    <div class="dl-title">💾 ダウンロード</div>
    <div class="dl-grid">
      <button class="dl-btn" onclick="dlAudio()">
        <div class="dl-icon a">🎵</div>
        <div><div class="dl-label">音声</div><div class="dl-sub" id="dlAName">.webm</div></div>
      </button>
      <button class="dl-btn" onclick="dlText()">
        <div class="dl-icon t">📄</div>
        <div><div class="dl-label">文字起こし</div><div class="dl-sub" id="dlTName">.txt</div></div>
      </button>
    </div>
  </div>
</div>

<script>
const S={IDLE:0,REC:1,PAUSED:2,DONE:3};
let state=S.IDLE;
let mr=null, strm=null, chunks=[], blob=null;
let rec=null, srOn=false, srTimer=null;
let tiv=null, sec=0;
let segs=[];

const pad=n=>String(n).padStart(2,'0');
const fmt=s=>`${pad(Math.floor(s/60))}:${pad(s%60)}`;
const $=id=>document.getElementById(id);

// ----- UI -----
function setUI(s){
  state=s;
  const badge=$('badge'),dot=$('dot'),btxt=$('badgeTxt');
  const br=$('btnRec'),bp=$('btnPause'),t=$('timer');
  badge.className='badge';dot.className='dot';
  if(s===S.IDLE){
    badge.classList.add('idle');btxt.textContent='待機中';
    br.textContent='● 録音開始';br.className='btn btn-rec';
    bp.disabled=true;bp.textContent='⏸ 一時停止';
    t.classList.remove('rec');
  }else if(s===S.REC){
    badge.classList.add('rec');dot.classList.add('blink');btxt.textContent='録音中…';
    br.textContent='■ 録音停止';br.className='btn btn-rec stop';
    bp.disabled=false;bp.textContent='⏸ 一時停止';
    t.classList.add('rec');
  }else if(s===S.PAUSED){
    badge.classList.add('paused');btxt.textContent='一時停止中';
    br.textContent='■ 録音停止';br.className='btn btn-rec stop';
    bp.disabled=false;bp.textContent='▶ 再開';
    t.classList.remove('rec');
  }else if(s===S.DONE){
    badge.classList.add('done');btxt.textContent='録音完了';
    br.textContent='● 新しい録音';br.className='btn btn-rec';
    bp.disabled=true;
    t.classList.remove('rec');
  }
}

// ----- タイマー -----
function tickStart(){tiv=setInterval(()=>{sec++;$('timer').textContent=fmt(sec);},1000);}
function tickStop(){clearInterval(tiv);tiv=null;}

// ----- ハンドラ -----
async function onRec(){
  if(state===S.IDLE||state===S.DONE) await start();
  else stop();
}
function onPause(){
  if(state===S.REC) pause();
  else if(state===S.PAUSED) resume();
}

// ----- 録音 -----
async function start(){
  chunks=[];blob=null;segs=[];sec=0;
  $('timer').textContent='00:00';
  $('srCount').textContent='';$('srCount').className='sr-count';
  $('dlCard').classList.remove('show');

  try{ strm=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ alert('マイクの許可が必要です。アドレスバーのマイクアイコンから許可してください。'); return; }

  const mime=(['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4']
    .find(t=>MediaRecorder.isTypeSupported(t)))||'';
  mr=new MediaRecorder(strm,mime?{mimeType:mime}:{});
  mr.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data);};
  mr.onstop=()=>{
    blob=new Blob(chunks,{type:mr.mimeType});
    strm.getTracks().forEach(t=>t.stop());
    showDl();
  };
  mr.start(300);
  setUI(S.REC);
  tickStart();
  srStart();
}

function stop(){
  tickStop();srStop();
  if(mr&&mr.state!=='inactive')mr.stop();
  setUI(S.DONE);
}

function pause(){
  if(mr&&mr.state==='recording')mr.pause();
  tickStop();srStop();
  setUI(S.PAUSED);
}

function resume(){
  if(mr&&mr.state==='paused')mr.resume();
  tickStart();srStart();
  setUI(S.REC);
}

// ----- 音声認識（バックグラウンド） -----
function srStart(){
  if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)) return;
  srStop();
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  rec=new SR();
  rec.lang='ja-JP';
  rec.continuous=true;
  rec.interimResults=false; // 確定テキストのみ収集（軽量化）
  rec.maxAlternatives=1;

  rec.onstart=()=>{
    srOn=true;
    $('srCount').textContent='🎤 文字起こし収集中';
    $('srCount').className='sr-count ok';
  };
  rec.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal){
        const t=e.results[i][0].transcript.trim();
        if(t) segs.push({time:fmt(sec),text:t});
        updateCount();
      }
    }
  };
  rec.onerror=e=>{
    srOn=false;
    if(e.error==='no-speech'||e.error==='aborted') { schedSR(); return; }
    schedSR();
  };
  rec.onend=()=>{ srOn=false; schedSR(); };

  try{ rec.start(); }catch(e){ schedSR(); }
}

function schedSR(){
  clearTimeout(srTimer);
  if(state!==S.REC||srOn) return;
  srTimer=setTimeout(()=>{ if(state===S.REC&&!srOn) srStart(); },500);
}

function srStop(){
  clearTimeout(srTimer);
  srOn=false;
  if(rec){
    rec.onend=null;rec.onresult=null;rec.onerror=null;rec.onstart=null;
    try{ rec.abort(); }catch(e){}
    rec=null;
  }
  $('srCount').textContent='';$('srCount').className='sr-count';
}

function updateCount(){
  const n=segs.length;
  const c=segs.reduce((s,t)=>s+t.text.length,0);
  $('srCount').textContent=`🎤 ${n}発言 / ${c}文字 収集済み`;
  $('srCount').className='sr-count ok';
}

// ----- ダウンロード -----
function base(){
  const t=$('title').value.trim()||'MTG録音';
  const d=new Date();
  return `${t}_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
}
function showDl(){
  const n=base();
  const ext=blob?(blob.type.includes('mp4')?'mp4':'webm'):'webm';
  $('dlAName').textContent=n+'.'+ext;
  $('dlTName').textContent=n+'.txt';
  $('dlCard').classList.add('show');
}
function dlAudio(){
  if(!blob)return;
  const ext=blob.type.includes('mp4')?'mp4':'webm';
  dl(URL.createObjectURL(blob),base()+'.'+ext);
}
function dlText(){
  const title=$('title').value.trim()||'MTG録音';
  const now=new Date().toLocaleString('ja-JP');
  let txt=`【${title}】\n日時：${now}\n時間：${fmt(sec)}\n${'─'.repeat(32)}\n\n`;
  if(segs.length===0){
    txt+='（文字起こしデータなし — Chromeでの録音を推奨）\n';
  }else{
    segs.forEach(s=>{ txt+=`[${s.time}] ${s.text}\n`; });
  }
  const b=new Blob([txt],{type:'text/plain;charset=utf-8'});
  dl(URL.createObjectURL(b),base()+'.txt');
}
function dl(url,name){
  const a=document.createElement('a');
  a.href=url;a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
</script>
</body>
</html>
